      "@type": "Question",

        "@type": "Answer",

      }
    },
    {
      "@type": "Question",
      "name": "Can I use Eva like an app?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Open Eva on your phone and choose Add to home screen. Online AI readings need an internet connection."
      }
    },
    {
      "@type": "Question",
      "name": "How do payments work?",
      "acceptedAnswer": {
